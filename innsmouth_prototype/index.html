<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Innsmouth Undertow — Physics Roguelite Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Innsmouth Undertow</h1>
    <p class="subtitle">A physics-only pixel-art roguelite prototype inspired by The Shadow over Innsmouth.</p>
    <canvas id="game" width="320" height="180" aria-label="game viewport"></canvas>
    <section class="hud">
      <p><strong>Move:</strong> WASD / Arrow keys · <strong>Dash:</strong> Space · <strong>Aim:</strong> Mouse · <strong>Harpoon:</strong> Click</p>
      <p><strong>Objective:</strong> Survive cultist waves, gather relic shards, and dive deeper before the tide claims you.</p>
      <p id="status"></p>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
